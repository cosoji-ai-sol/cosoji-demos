function Btn({ label, onClick, primary, small, danger, disabled }) {
  const bg = disabled ? "#ccc" : danger ? C.red : primary ? C.navy : "#fff";
  const col = disabled ? "#888" : danger || primary ? "#fff" : C.navy;
  const bdr = disabled ? "#ccc" : danger ? C.red : primary ? C.navy : C.border;
  return React.createElement("button", {
    onClick: disabled ? undefined : onClick,
    disabled: disabled,
    style: {
      background: bg, color: col, border: `1px solid ${bdr}`, borderRadius: 4,
      padding: small ? "4px 12px" : "7px 16px", fontSize: small ? 12 : 13,
      fontWeight: 600, cursor: disabled ? "default" : "pointer", whiteSpace: "nowrap"
    }
  }, label);
}

function TH({ children, w }) {
  return React.createElement("th", {
    style: {
      padding: "7px 10px", fontSize: 12, fontWeight: 700, color: C.textMid, textAlign: "left",
      background: C.tableHead, borderBottom: `1px solid ${C.border}`, borderRight: `1px solid ${C.borderLight}`,
      whiteSpace: "nowrap", width: w
    }
  }, children);
}

function TD({ children, center, bold, small }) {
  return React.createElement("td", {
    style: {
      padding: "7px 10px", fontSize: small ? 11 : 13, fontWeight: bold ? 600 : 400,
      color: bold ? C.text : C.textMid, textAlign: center ? "center" : "left",
      borderBottom: `1px solid ${C.borderLight}`, borderRight: `1px solid ${C.borderLight}`, whiteSpace: "nowrap",
      overflow: "hidden", textOverflow: "ellipsis"
    }
  }, children);
}

  const [quickFilter, setQuickFilter] = useState(null); // ダッシュボードの数字クリックで進捗一覧を絞り込むフィルタ

  const generateReport = (p, refCase) => {
    const today = "2026/08/07";
    return `【事故状況報告書（AI自動生成・編集可）】
発生確認日: ${today}
物件: ${p.name}（${p.unit}）
被害状況: ${refCase.title}
事故種別: ${refCase.type}
被害推定額: ${fmtMoney(refCase.cost)}
突合保険証券: ${p.insurer}（証券番号 ${p.policyNo} ／ ${p.rider}）
特記事項: 本件は${refCase.type}に該当する可能性が${refCase.prob >= 50 ? "高く" : "低く"}、査定時の参考資料としてご活用ください。`;
  };

  const handlePhotoChange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setPhotoPreview(reader.result);
    reader.readAsDataURL(file);
    setPhotoFileName(file.name);
  };

  // ダッシュボード・ヘッダー共通で使う集計値（案件データから算出。ハードコードしない）
  const totalCases = cases.length;
  const inProgressCases = cases.filter(c => c.holderType === "insurer" || c.holderType === "internal");
  const confirmedCases = cases.filter(c => c.insStatus === "着金確定");
  const confirmedSum = confirmedCases.reduce((s, c) => s + c.cost, 0);
  const leadTimes = cases.filter(c => c.leadTimeDays != null).map(c => c.leadTimeDays);
  const avgLeadTime = leadTimes.length ? (leadTimes.reduce((s, d) => s + d, 0) / leadTimes.length) : 0;
  const outOfScopeCases = cases.filter(c => c.insStatus.includes("対象外"));
  const outOfScopeButPossible = outOfScopeCases.filter(c => c.prob >= 50);

  // 月次・年次トレンド（発生日ベースで集計。ハードコードせずCASESから算出）
  const groupBy = (keyFn) => {
    const map = {};
    cases.forEach(c => {
      const key = keyFn(c.date);
      if (!map[key]) map[key] = { key, count: 0, cost: 0, confirmed: 0 };
      map[key].count += 1;
      map[key].cost += c.cost;
      if (c.insStatus === "着金確定") map[key].confirmed += c.cost;
    });
    return Object.values(map).sort((a, b) => a.key.localeCompare(b.key));
  };
  const monthlyTrend = groupBy(d => d.slice(0, 7));   // "2026/08"
  const yearlyTrend = groupBy(d => d.slice(0, 4));    // "2026"
  const trendData = chartMode === "monthly" ? monthlyTrend : yearlyTrend;

  // 物件別 件数・着金額（設備台帳デモに近い内訳グラフ）
  const byProperty = PROPERTIES.map(p => {
    const list = cases.filter(c => c.prop === p.name);
